* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #0d1b2a; color: #e0e0e0; min-height: 100vh; }

header {
  background: linear-gradient(135deg, #1a3a5c, #0d2137);

header .subtitle { font-size: 0.72em; color: #8aaec8; margin-top: 2px; }
.stamp { font-size: 0.75em; color: #4caf7d; background: #0d2137; border: 1px solid #4caf7d; border-radius: 6px; padding: 5px 10px; }

.tab-bar {
  display: flex; gap: 4px; padding: 10px 16px 0;
  background: #111f2e; border-bottom: 2px solid #1a2e42; flex-wrap: wrap;
}
.tab {
  background: #1a2e42; border: 1px solid #2a4a6a; color: #8aaec8;
  border-radius: 6px 6px 0 0; padding: 6px 14px; font-size: 0.8em;
  cursor: pointer; font-family: Arial, sans-serif; margin-bottom: -2px;
  border-bottom: 2px solid #1a2e42;
}
.tab.active { background: #0d1b2a; border-color: #c9a84c; border-bottom-color: #0d1b2a; color: #c9a84c; font-weight: bold; }

.filter-bar {
  padding: 8px 16px; display: flex; gap: 6px; flex-wrap: wrap;
  background: #0d1b2a; border-bottom: 1px solid #1a2e42;
}
.conf-btn {
  background: #1a2e42; border: 1px solid #2a4a6a; color: #8aaec8;
  border-radius: 20px; padding: 3px 10px; font-size: 0.72em;
  cursor: pointer; font-family: Arial, sans-serif;
}
.conf-btn.active { border-color: #c9a84c; color: #c9a84c; }

.content { padding: 14px; overflow-x: auto; }

table { width: 100%; border-collapse: collapse; font-size: 0.82em; }
thead th {
  background: #1a3a5c; color: #c9a84c; padding: 9px 7px;
  text-align: left; font-size: 0.78em; border-bottom: 2px solid #c9a84c;
  white-space: nowrap; cursor: pointer; user-select: none;
}
thead th:hover { background: #1f4570; }
thead th.sa::after { content:" ↑"; color:#fff; }
thead th.sd::after { content:" ↓"; color:#fff; }
tbody tr { border-bottom: 1px solid #1a2e42; }
tbody tr:hover { background: #1a2e42; }
tbody td { padding: 7px 7px; vertical-align: middle; }

.rb { display:inline-block; background:#1a3a5c; border:1px solid #2a4a6a; border-radius:4px; padding:2px 5px; font-weight:bold; font-size:0.88em; min-width:28px; text-align:center; }
.rb.t3 { border-color:#c9a84c; color:#c9a84c; }
.rb.t10 { border-color:#8aaec8; color:#8aaec8; }
.pts-cell { font-weight:bold; color:#4caf7d; }
.cb { display:inline-block; border-radius:4px; padding:2px 6px; font-size:0.72em; font-weight:bold; color:#0d1b2a; }
.UEFA{background:#5b9bd5;} .CONMEBOL{background:#f0c84a;} .CONCACAF{background:#4caf7d;}
.CAF{background:#e07b3a;} .AFC{background:#b07fd4;} .OFC{background:#5bbf7a;}
.gb { display:inline-block; background:#0d2137; border:1px solid #2a4a6a; border-radius:4px; padding:1px 5px; font-size:0.78em; font-weight:bold; color:#8aaec8; }
.lc { font-size:0.75em; color:#8aaec8; }
.lc b { color:#c9a84c; }

/* Groups grid */
.groups-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(270px, 1fr)); gap:14px; }
.group-card { background:#111f2e; border:1px solid #1a2e42; border-radius:8px; overflow:hidden; }
.group-card h3 { background:#1a3a5c; color:#c9a84c; padding:7px 12px; font-size:0.85em; letter-spacing:1px; border-bottom:1px solid #c9a84c; }
.group-card table { font-size:0.78em; }
.group-card thead th { background:#1a2e42; color:#8aaec8; font-size:0.7em; padding:5px 6px; border-bottom:1px solid #2a4a6a; cursor:default; }
.group-card thead th:hover { background:#1a2e42; }
.group-card tbody td { padding:5px 6px; }
.group-card tbody tr:first-child td { color:#fff; font-weight:bold; }
.group-card tbody tr:nth-child(2) td { color:#c8e0f0; }
.adv { width:3px; background:#4caf7d; }
.adv2 { width:3px; background:#8aaec8; }

footer { text-align:center; padding:14px; font-size:0.68em; color:#3a5a7a; border-top:1px solid #1a2e42; margin-top:10px; }

/* ── Knockout bracket ── */
.knockout-wrap { padding: 14px; overflow-x: auto; }
.ko-stage { margin-bottom: 28px; }
.ko-stage h3 {
  color: #c9a84c; font-size: 0.9em; letter-spacing: 1px;
  border-bottom: 1px solid #c9a84c; padding-bottom: 6px; margin-bottom: 12px;
}
.ko-matches {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 10px;
}
.ko-match {
  background: #111f2e; border: 1px solid #1a2e42; border-radius: 8px;
  overflow: hidden; font-size: 0.82em;
}
.ko-match .match-header {
  background: #1a2e42; padding: 4px 10px; font-size: 0.7em;
  color: #8aaec8; display: flex; justify-content: space-between;
}
.ko-team {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 10px; border-bottom: 1px solid #0d1b2a;
}
.ko-team:last-child { border-bottom: none; }
.ko-team.winner { background: #0d2137; }
.ko-team .tname { color: #e0e0e0; flex: 1; }
.ko-team .tname.tbd { color: #3a5a7a; font-style: italic; }
.ko-team .tscore {
  font-weight: bold; color: #c9a84c; min-width: 20px; text-align: right;

.ko-team .conf-dot {
  width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; flex-shrink: 0;

.UEFA-dot{background:#5b9bd5;} .CONMEBOL-dot{background:#f0c84a;}
.CONCACAF-dot{background:#4caf7d;} .CAF-dot{background:#e07b3a;}
.AFC-dot{background:#b07fd4;} .OFC-dot{background:#5bbf7a;}
.ko-note { font-size:0.68em; color:#3a5a7a; margin-top:10px; text-align:center; }
</style>

// Team conf lookup
function getConf(name) {
  const t = TEAMS.find(x => x.name === name);
  return t ? t.conf.replace(/[^A-Z]/g,'') : '';
}

function renderKnockout() {
  let h = '<div class="knockout-wrap">';

  // Legend
  h += `<p style="font-size:0.75em;color:#8aaec8;margin-bottom:16px">
    Bracket wordt gevuld na afloop van de groepsfase (27 jun). 
    Sloten zoals <b style="color:#c9a84c">1A</b>=winnaar groep A, 
    <b style="color:#c9a84c">2B</b>=runner-up groep B, 
    <b style="color:#c9a84c">3X</b>=beste nr.3.
  </p>`;

  for (const stage of KO_STAGES) {
    h += `<div class="ko-stage">
      <h3>${stage.label} &nbsp;<span style="font-size:0.8em;color:#8aaec8;font-weight:normal">${stage.dates}</span></h3>
      <div class="ko-matches">`;

    for (const m of stage.matches) {
      const homeTeam = resolveSlot(m.home);
      const awayTeam = resolveSlot(m.away);
      const homeConf = homeTeam ? getConf(homeTeam) : '';
      const awayConf = awayTeam ? getConf(awayTeam) : '';
      const homeWon = m.w && m.w === (homeTeam || m.home);
      const awayWon = m.w && m.w === (awayTeam || m.away);

      h += `<div class="ko-match">
        <div class="match-header">
          <span>M${m.id} · ${m.date}</span>
          <span>${m.venue}</span>
        </div>
        <div class="ko-team ${homeWon?'winner':''}">
          <span class="conf-dot ${homeConf}-dot"></span>
          <span class="tname ${homeTeam?'':'tbd'}">${homeTeam || m.home}</span>
          <span class="tscore">${m.hs !== null ? m.hs : ''}</span>
        </div>
        <div class="ko-team ${awayWon?'winner':''}">
          <span class="conf-dot ${awayConf}-dot"></span>
          <span class="tname ${awayTeam?'':'tbd'}">${awayTeam || m.away}</span>
          <span class="tscore">${m.as !== null ? m.as : ''}</span>
        </div>
      </div>`;
    }
    h += '</div></div>';
  }

  h += '<p class="ko-note">Stippen: 🔵UEFA 🟡CONMEBOL 🟢CONCACAF 🟠CAF 🟣AFC 🟩OFC</p>';
  h += '</div>';
  return h;
}

// ── State ─────────────────────────────────────────────────────────────────
let currentTab = 'ranking', currentConf = 'ALL';
let sortCol = 'rank', sortDir = 'asc';

function getLive(name) { return LIVE[name] || null; }

// ── Tabs ──────────────────────────────────────────────────────────────────
function showTab(tab) {
  currentTab = tab;
  ['Ranking','Groups','Knockout','Full'].forEach(t => {
    document.getElementById('tab'+t).classList.toggle('active', t.toLowerCase()===tab);
  });
  document.getElementById('filterBar').style.display = tab==='full' ? 'flex' : 'none';
  render();
}
function filterConf(conf, btn) {
  currentConf = conf;
  document.querySelectorAll('.conf-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

// ── Sort ──────────────────────────────────────────────────────────────────
function sortBy(col) {
  sortDir = (sortCol===col && sortDir==='asc') ? 'desc' : 'asc';
  sortCol = col;
  render();
}
function sc(col) { return sortCol===col ? (sortDir==='asc'?'sa':'sd') : ''; }
function sorted(arr) {
  return [...arr].sort((a,b) => {
    let va=a[sortCol], vb=b[sortCol];
    if (typeof va==='string') { va=va.toLowerCase(); vb=vb.toLowerCase(); }
    if (va<vb) return sortDir==='asc'?-1:1;
    if (va>vb) return sortDir==='asc'?1:-1;
    return 0;
  });
}

// ── Render ────────────────────────────────────────────────────────────────
function render() {
  const el = document.getElementById('mainContent');
  if (currentTab==='groups')  { el.innerHTML = renderGroups();  return; }
  if (currentTab==='knockout') { el.innerHTML = renderKnockout(); return; }

  let rows = currentTab==='full'
    ? TEAMS.filter(r => currentConf==='ALL' || r.conf===currentConf)
    : TEAMS;
  rows = sorted(rows);
  const showLive = currentTab==='ranking';

  let h = `<table><thead><tr>
    <th onclick="sortBy('rank')"    class="${sc('rank')}">Rank</th>
    <th onclick="sortBy('name')"    class="${sc('name')}">Team</th>
    <th>Gr.</th>
    <th onclick="sortBy('conf')"    class="${sc('conf')}">Conf.</th>
    <th onclick="sortBy('fifaPts')" class="${sc('fifaPts')}">FIFA Punten</th>
    ${showLive ? '<th>WK Stand</th>' : ''}
  </tr></thead><tbody>`;

  for (const r of rows) {
    const rc = r.rank<=3?'t3':r.rank<=10?'t10':'';
    const cc = r.conf.replace(/[^A-Z]/g,'')||'UEFA';
    const lv = showLive ? getLive(r.name) : null;
    const lhtml = lv && lv.p>0
      ? `<span class="lc">${lv.p}G <b>${lv.pts}pt</b> ${lv.gf}:${lv.ga}</span>`
      : `<span style="color:#2a4a6a;font-size:0.8em">–</span>`;
    h += `<tr>
      <td><span class="rb ${rc}">${r.rank}</span></td>
      <td>${r.name}</td>
      <td><span class="gb">${r.group}</span></td>
      <td><span class="cb ${cc}">${r.conf}</span></td>
      <td><span class="pts-cell">${r.fifaPts.toFixed(2)}</span></td>
      ${showLive ? `<td>${lhtml}</td>` : ''}
    </tr>`;
  }
  h += `</tbody></table><p style="font-size:0.68em;color:#3a5a7a;margin-top:8px;text-align:right">${rows.length} teams</p>`;
  el.innerHTML = h;
}

function renderGroups() {
  // Build group lookup
  const groups = {};
  for (const t of TEAMS) {
    if (!groups[t.group]) groups[t.group] = [];
    const lv = getLive(t.name) || {p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};
    groups[t.group].push({...t, ...lv});
  }
  // Sort each group: pts desc, then gd desc, then gf desc, then FIFA rank asc
  for (const g of Object.keys(groups)) {
    groups[g].sort((a,b) => {
      if (b.pts !== a.pts) return b.pts - a.pts;
      const gda = a.gf-a.ga, gdb = b.gf-b.ga;
      if (gdb !== gda) return gdb - gda;
      if (b.gf !== a.gf) return b.gf - a.gf;
      return a.rank - b.rank;
    });
  }

  let h = '<div class="groups-grid">';
  for (const g of 'ABCDEFGHIJKL'.split('')) {
    const teams = groups[g] || [];
    h += `<div class="group-card"><h3>GROEP ${g}</h3>
      <table><thead><tr>
        <th style="width:3px"></th><th>Team</th><th title="Gespeeld">G</th>
        <th title="Gewonnen">W</th><th title="Gelijk">G</th><th title="Verloren">V</th>
        <th title="Doelpunten">D</th><th title="Punten">Pt</th>
      </tr></thead><tbody>`;
    teams.forEach((t,i) => {
      const cc = t.conf.replace(/[^A-Z]/g,'')||'UEFA';
      const advClass = i<2 ? 'adv' : i===2 ? 'adv2' : '';
      const gd = t.gf - t.ga;
      const gdStr = t.p>0 ? (gd>0?'+'+gd:gd) : '-';
      h += `<tr>
        <td class="${advClass}"></td>
        <td><span class="cb ${cc}" style="font-size:0.62em;padding:1px 4px">${t.conf.substring(0,3)}</span> ${t.name}</td>
        <td>${t.p}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td>
        <td style="font-size:0.85em">${t.p>0?t.gf+':'+t.ga:'-'}</td>
        <td><b style="color:#c9a84c">${t.pts}</b></td>
      </tr>`;
    });
    h += '</tbody></table></div>';
  }
  h += '</div><p style="font-size:0.68em;color:#3a5a7a;margin-top:12px">🟢 Groen = doorgeplaatst · Blauw = mogelijk door als beste nr.3</p>';
  return h;
}

// ── Load standings from backend ──────────────────────────────────────────
async function loadStandings() {
  try {
    const res  = await fetch('/api/standings');
    const data = await res.json();
    if (data.data) {
      Object.assign(LIVE, data.data);
      document.getElementById('stampTs').textContent =
        '📅 Bijgewerkt: ' + (data.updated_at || '?');
      render();
    } else {
      document.getElementById('stampTs').textContent = '📅 Nog geen live data — klik Update';
    }
  } catch(e) {
    document.getElementById('stampTs').textContent = '⚠ Kan stand niet laden';
  }
}

function refreshStandings() {
  window.location.href = '/admin';
}

async function doRefresh() {
  const pw = document.getElementById('pwInput').value.trim();
  if (!pw) return;
  const btn     = document.getElementById('btnRefresh');
  const stamp   = document.getElementById('stampTs');
  const pwError = document.getElementById('pwError');

  document.getElementById('pwModal').style.display = 'none';
  btn.disabled = true; btn.textContent = '↻ Bezig...';
  stamp.textContent = '⏳ Claude haalt stand op...';

  try {
    const res  = await fetch('/api/refresh', {
      method: 'POST',
      headers: { 'X-Admin-Key': pw }
    });
    const data = await res.json();
    if (res.status === 401) {
      stamp.textContent = '✗ Onjuist wachtwoord';
      return;
    }
    if (data.success) {
      await loadStandings();
    } else {
      stamp.textContent = '✗ ' + (data.error || 'Onbekende fout');
    }
  } catch(e) {
    stamp.textContent = '✗ Verbindingsfout';
  } finally {
    btn.disabled = false; btn.textContent = '↻ Update stand';
  }
}

function closeModal() {
  document.getElementById('pwModal').style.display = 'none';
}

// Load on startup
loadStandings();
render();
